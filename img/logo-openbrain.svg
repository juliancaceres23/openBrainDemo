<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Logo de Open Brain - Club de Aprendizaje">
  <!-- Símbolo / Isotipo circular -->
  <g transform="translate(10, 5)">
    <!-- Círculo base azul índigo -->
    <circle cx="35" cy="35" r="35" fill="#2F438C" />
    
    <!-- Cerebro estilizado rosa vivo -->
    <path d="M22 36 C18 36 15 32 15 28 C15 23 19 20 23 20 C24 17 28 14 33 14 C36 14 38 15 39 17 C41 15 44 14 47 14 C52 14 56 17 57 20 C61 20 65 23 65 28 C65 32 62 36 58 36 C59 38 59 41 57 44 C55 48 51 51 46 51 C45 51 44 51 43 50 C41 53 38 55 35 55 C32 55 29 53 27 50 C26 51 25 51 24 51 C19 51 15 48 13 44 C11 41 11 38 12 36 Z" fill="#F86DC1" />
    
    <!-- Hemisferio / Detalles suaves -->
    <path d="M35 20 Q35 34 35 48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M25 28 Q30 30 32 35" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M45 28 Q40 30 38 35" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Gafas / Lentes redondos con marco turquesa -->
    <circle cx="28" cy="34" r="6" fill="#FFFFFF" stroke="#5EC3CC" stroke-width="2.5" />
    <circle cx="42" cy="34" r="6" fill="#FFFFFF" stroke="#5EC3CC" stroke-width="2.5" />
    <!-- Puente de las gafas -->
    <path d="M34 34 L36 34" stroke="#5EC3CC" stroke-width="2.5" stroke-linecap="round" />
    <!-- Patillas -->
    <path d="M22 34 L18 33" stroke="#5EC3CC" stroke-width="2" stroke-linecap="round" />
    <path d="M48 34 L52 33" stroke="#5EC3CC" stroke-width="2" stroke-linecap="round" />

    <!-- Ojos dentro de los lentes -->
    <circle cx="28" cy="34" r="2.2" fill="#1B2340" />
    <circle cx="42" cy="34" r="2.2" fill="#1B2340" />
    <!-- Brillo en los ojos -->
    <circle cx="27.2" cy="33.2" r="0.8" fill="#FFFFFF" />
    <circle cx="41.2" cy="33.2" r="0.8" fill="#FFFFFF" />

    <!-- Sonrisa amigable -->
    <path d="M31 43 Q35 47 39 43" stroke="#1B2340" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Mejillas rosadas suaves -->
    <circle cx="21" cy="40" r="2.5" fill="#FEAFCF" opacity="0.8" />
    <circle cx="49" cy="40" r="2.5" fill="#FEAFCF" opacity="0.8" />
  </g>

  <!-- Tipografía del Logo -->
  <g transform="translate(90, 18)">
    <text x="0" y="28" font-family="'Nunito', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" fill="#2F438C" letter-spacing="-0.5">Open Brain</text>
    <text x="1" y="46" font-family="'Nunito', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#5EC3CC" letter-spacing="1.2" text-transform="uppercase">Club de Aprendizaje</text>
  </g>
</svg>
