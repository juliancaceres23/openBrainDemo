<!-- RF-26: Código QR que dirige al sitio web de Open Brain para usar en la sede física -->
<!--
  INSTRUCCIONES (documentadas también en el README):
  Una vez definida la URL final en Cloudflare Pages, genera el QR definitivo con
  cualquier generador gratuito (ej. https://www.qrcode-monkey.com) apuntando a
  https://[tu-dominio].pages.dev  y reemplaza este archivo con el PNG/SVG resultante.
  Sugerencia: usar los colores #2F438C (módulo) y #FFFFFF (fondo) para coherencia visual.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Código QR de Open Brain — escanea para visitar el sitio web">
  <!-- Fondo blanco -->
  <rect width="200" height="200" fill="#FFFFFF" rx="12"/>

  <!-- Marco azul índigo -->
  <rect x="4" y="4" width="192" height="192" fill="none" stroke="#2F438C" stroke-width="8" rx="10"/>

  <!-- Área de QR placeholder (patrón visual de posición) -->
  <!-- Esquina superior izquierda -->
  <rect x="20" y="20" width="52" height="52" rx="4" fill="#2F438C"/>
  <rect x="28" y="28" width="36" height="36" rx="2" fill="#FFFFFF"/>
  <rect x="36" y="36" width="20" height="20" rx="1" fill="#2F438C"/>

  <!-- Esquina superior derecha -->
  <rect x="128" y="20" width="52" height="52" rx="4" fill="#2F438C"/>
  <rect x="136" y="28" width="36" height="36" rx="2" fill="#FFFFFF"/>
  <rect x="144" y="36" width="20" height="20" rx="1" fill="#2F438C"/>

  <!-- Esquina inferior izquierda -->
  <rect x="20" y="128" width="52" height="52" rx="4" fill="#2F438C"/>
  <rect x="28" y="136" width="36" height="36" rx="2" fill="#FFFFFF"/>
  <rect x="36" y="144" width="20" height="20" rx="1" fill="#2F438C"/>

  <!-- Módulos de datos simulados (patrón visual) -->
  <rect x="92" y="20" width="8" height="8" fill="#2F438C"/>
  <rect x="104" y="20" width="8" height="8" fill="#2F438C"/>
  <rect x="92" y="32" width="8" height="8" fill="#2F438C"/>
  <rect x="92" y="44" width="8" height="8" fill="#2F438C"/>
  <rect x="104" y="44" width="8" height="8" fill="#2F438C"/>
  <rect x="116" y="44" width="8" height="8" fill="#2F438C"/>

  <rect x="92" y="88" width="8" height="8" fill="#2F438C"/>
  <rect x="104" y="88" width="8" height="8" fill="#2F438C"/>
  <rect x="116" y="88" width="8" height="8" fill="#2F438C"/>
  <rect x="128" y="88" width="8" height="8" fill="#2F438C"/>
  <rect x="92" y="100" width="8" height="8" fill="#2F438C"/>
  <rect x="116" y="100" width="8" height="8" fill="#2F438C"/>
  <rect x="92" y="112" width="8" height="8" fill="#2F438C"/>
  <rect x="104" y="112" width="8" height="8" fill="#2F438C"/>
  <rect x="128" y="112" width="8" height="8" fill="#2F438C"/>

  <rect x="92" y="128" width="8" height="8" fill="#2F438C"/>
  <rect x="104" y="128" width="8" height="8" fill="#2F438C"/>
  <rect x="92" y="140" width="8" height="8" fill="#2F438C"/>
  <rect x="116" y="140" width="8" height="8" fill="#2F438C"/>
  <rect x="128" y="140" width="8" height="8" fill="#2F438C"/>
  <rect x="140" y="140" width="8" height="8" fill="#2F438C"/>
  <rect x="92" y="152" width="8" height="8" fill="#2F438C"/>
  <rect x="104" y="152" width="8" height="8" fill="#2F438C"/>
  <rect x="116" y="152" width="8" height="8" fill="#2F438C"/>

  <!-- Texto inferior -->
  <text x="100" y="192" font-family="'Nunito', sans-serif" font-weight="800" font-size="9" fill="#2F438C" text-anchor="middle">openbrain.pages.dev</text>
</svg>
